name: media_kit_libs_linux
description: GNU/Linux dependency package for package:media_kit. Necessary for initialization.
# Copy of media_kit_libs_linux from github.com/media-kit/media-kit at c533e446755f51cf53c7e57aea873f2aa5355f81; the
# changes are listed in IMMUCH360-NOTE.md
publish_to: 'none'
version: 1.2.1+immuch360
homepage: https://immuch360.com
repository: https://github.com/immuch360/media_kit_360
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.4"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: MediaKitLibsLinuxPlugin
